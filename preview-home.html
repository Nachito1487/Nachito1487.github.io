<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ABCuerpo · Preview desktop y mobile</title><style>*{box-sizing:border-box}body{margin:0;background:#e9eef2;color:#0b2d4f;font:14px system-ui,sans-serif}header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;background:#fff;border-bottom:1px solid #cbdce3}header strong{font-size:18px}nav{display:flex;gap:8px;align-items:center}button,a{font:inherit;border-radius:24px;padding:10px 16px;border:1px solid #cadce3;background:#fff;color:#0b2d4f;cursor:pointer;text-decoration:none}button[aria-pressed=true]{background:#0b2d4f;color:#fff}button:focus-visible,a:focus-visible{outline:3px solid #00b3a6;outline-offset:3px}main{padding:18px 12px}#frame{position:relative;margin:auto;background:#fff;box-shadow:0 8px 36px #0b2d4f20;overflow:hidden;border-radius:12px}iframe{border:0;transform-origin:top left;background:#fff}p{text-align:center;font-size:12px;margin:10px auto 0;max-width:620px;line-height:1.5}@media(max-width:500px){header{padding:12px}header strong{font-size:16px}nav{width:100%;justify-content:center}button,a{padding:9px 13px;font-size:12px}}</style></head><body><header><strong>ABCuerpo · Home</strong><nav aria-label="Tamaño de preview"><button data-size="desktop" aria-pressed="true">Desktop</button><button data-size="mobile" aria-pressed="false">Mobile</button><a href="/">Abrir web ↗</a></nav></header><main><div id="frame"><iframe title="Preview navegable de ABCuerpo" src="/#inicio"></iframe></div><p>Es la web real dentro de un marco de 1536 px o 390 px. Podés explorar sus controles y desplazarte dentro de la preview. Esto no sustituye una prueba en dispositivos reales.</p></main><script>const frame=document.getElementById('frame'),iframe=frame.querySelector('iframe'),buttons=[...document.querySelectorAll('button[data-size]')];let mode=new URLSearchParams(location.search).get('view')==='mobile'?'mobile':'desktop';buttons.forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.size===mode)));function fit(){const w=mode==='mobile'?390:1536,h=mode==='mobile'?844:1024,s=Math.min(1,(innerWidth-24)/w);iframe.style.width=w+'px';iframe.style.height=h+'px';iframe.style.transform='scale('+s+')';frame.style.width=w*s+'px';frame.style.height=h*s+'px'}buttons.forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.size;buttons.forEach(x=>x.setAttribute('aria-pressed',String(x===b)));fit()}));addEventListener('resize',fit);fit();</script></body></html>
